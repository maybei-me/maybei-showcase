name: UI quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, build and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run UI automation suite
        id: ui-tests
        run: pnpm test:ui

      - name: Upload Playwright report and failure artifacts
        id: playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish UI test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Playwright UI automation"
            if [ "${{ steps.ui-tests.outcome }}" = "success" ]; then
              echo "✅ **UI test suite passed.**"
            elif [ "${{ steps.ui-tests.outcome }}" = "failure" ]; then
              echo "❌ **UI test suite failed.**"
            else
              echo "⚠️ **UI test suite did not complete.**"
            fi
            echo
            echo "Download the **playwright-report** artifact from this workflow run to open the HTML report."
            echo "Failure-only screenshots, videos and traces are included in the same artifact when generated."
          } >> "$GITHUB_STEP_SUMMARY"
