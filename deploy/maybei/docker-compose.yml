services:
  db:
    image: mysql:8.4
    container_name: maybei-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maybei
      MYSQL_USER: maybei
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - maybei_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - maybei_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: ../..
      dockerfile: deploy/maybei/Dockerfile
    container_name: maybei-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://maybei:${MYSQL_PASSWORD}@maybei-db:3306/maybei
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maybei_internal

volumes:
  maybei_mysql_data:

networks:
  maybei_internal:
    name: maybei_internal
